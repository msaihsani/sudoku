name: Build Sudoku AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www

      - name: Create package.json
        run: |
          echo '{
            "name": "sudoku",
            "version": "1.0.0",
            "description": "Sudoku Game",
            "main": "index.html"
          }' > package.json

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Init Capacitor
        run: |
          npx cap init "Sudoku" "com.game.sudoku" --web-dir "www"

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Copy web assets
        run: |
          npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build AAB (unsigned)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
